<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSport — Fontys ICT Challenge 2</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-slate-900 min-h-screen flex flex-col justify-between items-center font-sans select-none p-6">

  <!-- Top Header / Fontys Logo -->
  <header class="w-full max-w-sm flex items-center justify-between py-2">
    <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">
      Challenge 2
    </span>
    <img src="/assets/logoFontys.png" alt="Fontys Logo" class="h-7 w-auto object-contain" onerror="this.src='./assets/logoFontys.png';" />
  </header>

  <!-- Center Content -->
  <main class="max-w-xs w-full text-center space-y-7 my-auto">
    
    <!-- UniSport Logo & Letters (No text) -->
    <div class="space-y-3.5 flex flex-col items-center">
      <img src="/assets/logoUniSport.png" alt="UniSport Icon" class="h-20 w-auto object-contain" onerror="this.src='./assets/logoUniSport.png';" />
      <img src="/assets/lettersUniSport.png" alt="UniSport" class="h-7 w-auto object-contain" onerror="this.src='./assets/lettersUniSport.png';" />
      <p class="text-xs text-slate-400 font-medium">Sports Community Platform</p>
    </div>

    <!-- 2 Clean Action Links -->
    <div class="space-y-3 pt-1">
      
      <!-- Survey Link -->
      <a href="/challenge2/survey" class="w-full py-3.5 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm transition-all duration-200 shadow-sm flex items-center justify-between group">
        <span>Research Survey</span>
        <span class="text-indigo-200 group-hover:translate-x-1 transition-transform">&rarr;</span>
      </a>

      <!-- App Link -->
      <a href="/challenge2/unisportapp" class="w-full py-3.5 px-5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-sm border border-slate-200 transition-all duration-200 flex items-center justify-between group">
        <span>UniSport App</span>
        <span class="text-slate-400 group-hover:text-slate-700 group-hover:translate-x-1 transition-transform">&rarr;</span>
      </a>

    </div>

  </main>

  <!-- Clean Footer with Name and Fontys ICT -->
  <footer class="w-full max-w-sm py-4 border-t border-slate-100 text-center text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-1">
    <span>Martim Ferreira Galamba</span>
    <span class="font-medium text-slate-500">Fontys ICT</span>
  </footer>

</body>
</html>
