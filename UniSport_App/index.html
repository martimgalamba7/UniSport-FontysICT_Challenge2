<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSport App — Soon</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col justify-between font-sans select-none px-8 sm:px-16 lg:px-24 xl:px-32 py-8">

  <!-- Top Header Navigation -->
  <header class="w-full flex items-center justify-between">
    <a href="/" class="text-xs sm:text-sm font-semibold text-zinc-500 hover:text-white transition flex items-center space-x-1.5">
      <span>&larr;</span>
      <span>Back to Hub</span>
    </a>
    <a href="https://www.fontys.nl/" target="_blank" rel="noopener noreferrer" title="Fontys University of Applied Sciences" class="hover:opacity-80 transition-opacity">
      <img src="/assets/logoFontys.png" alt="Fontys" class="h-8 sm:h-9 w-auto object-contain" onerror="this.src='./assets/logoFontys.png';" />
    </a>
  </header>

  <!-- Large Bold Center Stage -->
  <main class="flex-grow flex flex-col items-center justify-center space-y-8 sm:space-y-12 text-center py-12">
    
    <!-- Large Natural UniSport Logo -->
    <img src="/assets/logoUniSport.png" alt="UniSport" class="h-36 sm:h-48 md:h-64 lg:h-72 w-auto object-contain transition-transform duration-500 hover:scale-105" onerror="this.src='./assets/logoUniSport.png';" />

    <!-- Massive Cinematic SOON Typography -->
    <h1 class="text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-black tracking-[0.2em] sm:tracking-[0.25em] text-white uppercase ml-[0.2em]">
      SOON
    </h1>

  </main>

  <!-- Bottom Bar -->
  <footer class="w-full flex items-center justify-between text-xs sm:text-sm text-zinc-600">
    <span>UniSport Platform</span>
    <span>Fontys ICT</span>
  </footer>

</body>
</html>
