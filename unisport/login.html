<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSport • Student Sign In</title>
  
  <link rel="icon" type="image/png" href="/assets/logoUniSport.png" />
  <link rel="apple-touch-icon" href="/assets/logoUniSport.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              orange: '#FF4D00',
              'orange-hover': '#EA4500',
            }
          }
        }
      }
    }
  </script>
  <script src="./theme.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-white text-zinc-900 dark:bg-black dark:text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-150">

  <!-- Minimal Header (Uber/Google Big-Tech Style) -->
  <header class="w-full px-6 sm:px-12 py-5 flex items-center justify-between border-b border-zinc-100 dark:border-zinc-900">
    <a href="/challenge2/unisport" class="flex items-center space-x-2.5">
      <img src="/assets/logoUniSport.png" alt="UniSport" class="h-7 w-auto object-contain" onerror="this.src='./assets/logoUniSport.png';" />
      <span class="font-bold text-lg tracking-tight text-zinc-950 dark:text-white">UniSport</span>
    </a>

    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-900 text-zinc-600 dark:text-zinc-400 transition" aria-label="Toggle Theme">
        <i data-lucide="sun" class="icon-sun w-4 h-4 hidden"></i>
        <i data-lucide="moon" class="icon-moon w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Centered Minimalist Stage -->
  <main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm space-y-6">

      <div class="space-y-1">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-950 dark:text-white">
          Sign in
        </h1>
        <p class="text-xs text-zinc-500 dark:text-zinc-400">
          Enter your university credentials to continue.
        </p>
      </div>

      <!-- Error Banner -->
      <div id="signin-error" class="hidden p-3 rounded-xl bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 text-xs font-medium"></div>

      <!-- Sign In Form (Email + Password) -->
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1.5">Student Email</label>
          <input 
            type="email" 
            id="login-email" 
            required 
            placeholder="name@student.fontys.nl" 
            class="w-full px-4 py-3.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 border-0 text-sm text-zinc-950 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-white transition"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1.5">Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="login-password" 
              required 
              placeholder="••••••••" 
              class="w-full px-4 pr-11 py-3.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 border-0 text-sm text-zinc-950 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-white transition"
            />
            <button type="button" id="btn-toggle-pass" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="btn-submit" 
          class="w-full py-3.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold transition"
        >
          Sign in
        </button>
      </form>

      <div class="pt-6 border-t border-zinc-100 dark:border-zinc-900 text-center">
        <p class="text-xs text-zinc-500 dark:text-zinc-400">
          Don't have an account? 
          <a href="./register.html" class="font-semibold text-zinc-950 dark:text-white hover:underline ml-1">
            Create account
          </a>
        </p>
      </div>

      <p class="text-[11px] text-zinc-400 dark:text-zinc-600 leading-relaxed text-center">
        Only student accounts from @student.fontys.nl or @student.tue.nl are permitted.
      </p>

    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>

  <!-- Login Logic Script -->
  <script type="module">
    import { loginStudentWithPassword } from "./auth.js";

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("login-email");
    const passInput = document.getElementById("login-password");
    const btnSubmit = document.getElementById("btn-submit");
    const errorBox = document.getElementById("signin-error");
    const togglePass = document.getElementById("btn-toggle-pass");

    togglePass.addEventListener("click", () => {
      passInput.type = passInput.type === "password" ? "text" : "password";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");

      const email = emailInput.value.trim();
      const password = passInput.value;

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Signing in...";

      try {
        const res = await loginStudentWithPassword(email, password);
        if (res.success) {
          // Direct to welcome confirmation page
          window.location.href = "./welcome.html";
        } else {
          errorBox.textContent = res.error || "Invalid student credentials.";
          errorBox.classList.remove("hidden");
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Sign in";
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Sign in";
      }
    });
  </script>

</body>
</html>
