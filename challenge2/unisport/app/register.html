<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSport • Create Account</title>
  
  <link rel="icon" type="image/png" href="/assets/logoUniSport.png" />
  <link rel="apple-touch-icon" href="/assets/logoUniSport.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              orange: '#FF4D00',
              'orange-hover': '#EA4500',
            }
          }
        }
      }
    }
  </script>
  <script src="./theme.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .chip-select {
      transition: all 0.12s ease;
      user-select: none;
    }
    .chip-select.selected {
      background-color: #18181b;
      color: #ffffff;
      border-color: #18181b;
    }
    .dark .chip-select.selected {
      background-color: #ffffff;
      color: #09090b;
      border-color: #ffffff;
    }
    .avatar-btn.selected {
      border-color: #FF4D00;
      transform: scale(1.08);
    }
  </style>
</head>

<body class="bg-white text-zinc-900 dark:bg-black dark:text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-150">

  <!-- Minimal Header (Uber/Google Big-Tech Style) -->
  <header class="w-full px-6 sm:px-12 py-5 flex items-center justify-between border-b border-zinc-100 dark:border-zinc-900">
    <a href="/challenge2/unisport" class="flex items-center space-x-2.5">
      <img src="/assets/logoUniSport.png" alt="UniSport" class="h-7 w-auto object-contain" onerror="this.src='./assets/logoUniSport.png';" />
      <span class="font-bold text-lg tracking-tight text-zinc-950 dark:text-white">UniSport</span>
    </a>

    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-900 text-zinc-600 dark:text-zinc-400 transition" aria-label="Toggle Theme">
        <i data-lucide="sun" class="icon-sun w-4 h-4 hidden"></i>
        <i data-lucide="moon" class="icon-moon w-4 h-4"></i>
      </button>

      <a href="./login.html" class="text-xs font-semibold text-zinc-500 hover:text-zinc-950 dark:hover:text-white transition">
        Sign in
      </a>
    </div>
  </header>

  <!-- Centered Minimalist Flow -->
  <main class="flex-grow flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-md space-y-6">

      <!-- Progress Step Bar -->
      <div class="flex items-center gap-2">
        <div id="bar-1" class="h-1 flex-1 rounded-full bg-zinc-950 dark:bg-white transition-all"></div>
        <div id="bar-2" class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-800 transition-all"></div>
        <div id="bar-3" class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-800 transition-all"></div>
      </div>

      <!-- Error Notification -->
      <div id="reg-error" class="hidden p-3 rounded-xl bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 text-xs font-medium"></div>

      <!-- ================= STEP 1: EMAIL ================= -->
      <div id="step-1" class="space-y-6">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-950 dark:text-white">
            What's your student email?
          </h1>
          <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1.5">
            Only verified for @student.fontys.nl or @student.tue.nl
          </p>
        </div>

        <div class="space-y-4">
          <input 
            type="email" 
            id="reg-email" 
            required 
            placeholder="name@student.fontys.nl" 
            class="w-full px-4 py-3.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 border-0 text-sm text-zinc-950 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-white transition"
          />

          <div class="relative">
            <input 
              type="password" 
              id="reg-password" 
              required 
              minlength="6"
              placeholder="Create a password (min. 6 characters)" 
              class="w-full px-4 py-3.5 pr-11 rounded-xl bg-zinc-100 dark:bg-zinc-900 border-0 text-sm text-zinc-950 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-white transition"
            />
            <button 
              type="button" 
              id="toggle-password" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition"
              aria-label="Toggle password visibility"
            >
              <i data-lucide="eye" id="icon-eye" class="w-4 h-4"></i>
              <i data-lucide="eye-off" id="icon-eye-off" class="w-4 h-4 hidden"></i>
            </button>
          </div>

          <button 
            type="button" 
            id="btn-step1" 
            class="w-full py-3.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold transition"
          >
            Continue
          </button>
        </div>

        <div class="pt-6 border-t border-zinc-100 dark:border-zinc-900 text-center">
          <p class="text-xs text-zinc-500 dark:text-zinc-400">
            Already have an account? 
            <a href="./login.html" class="font-semibold text-zinc-950 dark:text-white hover:underline ml-1">
              Sign in
            </a>
          </p>
        </div>
      </div>

      <!-- ================= STEP 2: NAME ================= -->
      <div id="step-2" class="hidden space-y-6">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-950 dark:text-white">
            What's your name?
          </h1>
          <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1.5">
            This is shown to fellow students on match rosters.
          </p>
        </div>

        <div class="space-y-4">
          <input 
            type="text" 
            id="reg-name" 
            required 
            placeholder="First and last name" 
            class="w-full px-4 py-3.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 border-0 text-sm text-zinc-950 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-white transition"
          />

          <div class="flex items-center gap-2">
            <button 
              type="button" 
              id="btn-back-step2" 
              class="w-1/3 py-3.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 text-sm font-semibold hover:bg-zinc-200 dark:hover:bg-zinc-800 transition"
            >
              Back
            </button>
            <button 
              type="button" 
              id="btn-step2" 
              class="w-2/3 py-3.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold transition"
            >
              Continue
            </button>
          </div>
        </div>
      </div>

      <!-- ================= STEP 3: ATHLETIC PROFILE & ANALYTICS QUESTIONS ================= -->
      <div id="step-3" class="hidden space-y-7">
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-950 dark:text-white">
            Your athletic profile
          </h1>
          <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1.5">
            Select your preferences and customize your avatar badge.
          </p>
        </div>

        <!-- Question 0: Kick.com-Style Avatar Selection -->
        <div class="space-y-2.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
            Choose your avatar character
          </label>
          <div class="grid grid-cols-3 sm:grid-cols-6 gap-3" id="avatar-grid">
            <!-- Rendered via JS -->
          </div>
        </div>

        <!-- Question 1: Sports (Multi-Select + Other with Text Input) -->
        <div class="space-y-2.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
            1. Which sports do you play or want to practice?
          </label>
          <div class="flex flex-wrap gap-2" id="group-sports">
            <button type="button" data-val="Football" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Football</button>
            <button type="button" data-val="Gym & Fitness" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Gym / Fitness</button>
            <button type="button" data-val="Running" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Running</button>
            <button type="button" data-val="Basketball" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Basketball</button>
            <button type="button" data-val="Bouldering" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Bouldering</button>
            <button type="button" data-val="Padel / Tennis" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Padel / Tennis</button>
            <button type="button" data-val="Volleyball" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Volleyball</button>
            <button type="button" data-val="Swimming" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Swimming</button>
            <button type="button" data-val="Cycling" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Cycling</button>
            <button type="button" id="btn-sport-other" data-val="Other" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">+ Other</button>
          </div>

          <!-- Dynamic Text Input for Other Sport -->
          <div id="sport-other-container" class="hidden pt-2">
            <input 
              type="text" 
              id="inp-sport-other" 
              placeholder="Specify your sport (e.g. Boxing, Badminton, Calisthenics)..." 
              class="w-full px-4 py-3 rounded-xl bg-zinc-100 dark:bg-zinc-900 border-0 text-sm text-zinc-950 dark:text-white placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-950 dark:focus:ring-white transition"
            />
          </div>
        </div>

        <!-- Question 2: Play Preference (Alone vs Group) -->
        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
            2. How do you prefer to exercise?
          </label>
          <div class="flex flex-wrap gap-2" id="group-social">
            <button type="button" data-val="In a group / team" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">In a team / group</button>
            <button type="button" data-val="With a 1-on-1 partner" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">1-on-1 Workout partner</button>
            <button type="button" data-val="Solo (open to company)" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Solo (open to company)</button>
            <button type="button" data-val="Open to meeting new students" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Meet new students</button>
          </div>
        </div>

        <!-- Question 3: Skill / Intensity Level -->
        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
            3. What is your preferred game intensity?
          </label>
          <div class="flex flex-wrap gap-2" id="group-intensity">
            <button type="button" data-val="Casual & Social" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Casual & Social</button>
            <button type="button" data-val="Regular exercise" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Regular exercise</button>
            <button type="button" data-val="Competitive & High Intensity" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Competitive & High Intensity</button>
          </div>
        </div>

        <!-- Question 4: Schedule / Preferred Days -->
        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
            4. When do you usually have time for sports?
          </label>
          <div class="flex flex-wrap gap-2" id="group-schedule">
            <button type="button" data-val="Weekday Evenings" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Weekday Evenings</button>
            <button type="button" data-val="Between / After classes" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Between/After classes</button>
            <button type="button" data-val="Weekends" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Weekends</button>
            <button type="button" data-val="Early Mornings" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Early Mornings</button>
          </div>
        </div>

        <!-- Question 5: Eindhoven Locations -->
        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
            5. Locations you frequently visit in Eindhoven
          </label>
          <div class="flex flex-wrap gap-2" id="group-locations">
            <button type="button" data-val="Student Sports Centre (SSC)" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">SSC Campus</button>
            <button type="button" data-val="Fontys Rachelsmolen" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Fontys Rachelsmolen</button>
            <button type="button" data-val="Strijp-S (Monk/Area51)" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Strijp-S</button>
            <button type="button" data-val="Genneper Parken" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Genneper Parken</button>
            <button type="button" data-val="Centrum" class="chip-select px-3.5 py-2 rounded-xl text-xs font-semibold border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200">Centrum</button>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 pt-2">
          <button 
            type="button" 
            id="btn-back-step3" 
            class="w-1/3 py-3.5 rounded-xl bg-zinc-100 dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 text-sm font-semibold hover:bg-zinc-200 dark:hover:bg-zinc-800 transition"
          >
            Back
          </button>
          <button 
            type="button" 
            id="btn-finish" 
            class="w-2/3 py-3.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold transition"
          >
            Create Account
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>

  <!-- Step Logic & Multi-Selection Collector -->
  <script type="module">
    import { registerStudentWithPassword, validateStudentEmail } from "./auth.js";
    import { UNISPORT_AVATARS } from "./avatars.js";

    let step = 1;
    let selectedAvatarId = "bolt";

    const emailInp = document.getElementById("reg-email");
    const passwordInp = document.getElementById("reg-password");
    const togglePasswordBtn = document.getElementById("toggle-password");
    const iconEye = document.getElementById("icon-eye");
    const iconEyeOff = document.getElementById("icon-eye-off");
    const nameInp = document.getElementById("reg-name");
    const errBox = document.getElementById("reg-error");
    const sportOtherBtn = document.getElementById("btn-sport-other");
    const sportOtherContainer = document.getElementById("sport-other-container");
    const sportOtherInput = document.getElementById("inp-sport-other");

    // Toggle password visibility
    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInp.type === "password";
        passwordInp.type = isPassword ? "text" : "password";
        iconEye.classList.toggle("hidden", isPassword);
        iconEyeOff.classList.toggle("hidden", !isPassword);
      });
    }

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.remove("hidden");
    }

    function clearError() {
      errBox.classList.add("hidden");
    }

    // Render Kick.com-Style Avatar Badges
    const avatarGrid = document.getElementById("avatar-grid");
    UNISPORT_AVATARS.forEach(av => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.id = av.id;
      btn.className = `avatar-btn group relative flex flex-col items-center gap-1.5 p-2 rounded-2xl border-2 transition-all ${av.id === selectedAvatarId ? 'selected border-brand-orange bg-orange-500/10' : 'border-zinc-200 dark:border-zinc-800 hover:border-zinc-400'}`;
      btn.innerHTML = `
        <div class="w-14 h-14 rounded-full overflow-hidden bg-gradient-to-tr ${av.bg} p-0.5 shadow-md flex items-center justify-center">
          <div class="w-full h-full rounded-full overflow-hidden bg-zinc-950 flex items-center justify-center">
            ${av.svg}
          </div>
        </div>
        <span class="text-[11px] font-bold text-zinc-800 dark:text-zinc-200 truncate w-full text-center">${av.name}</span>
      `;
      btn.addEventListener("click", () => {
        document.querySelectorAll(".avatar-btn").forEach(b => {
          b.classList.remove("selected", "border-brand-orange", "bg-orange-500/10");
          b.classList.add("border-zinc-200", "dark:border-zinc-800");
        });
        btn.classList.add("selected", "border-brand-orange", "bg-orange-500/10");
        btn.classList.remove("border-zinc-200", "dark:border-zinc-800");
        selectedAvatarId = av.id;
      });
      avatarGrid.appendChild(btn);
    });

    // Multi-select chip handler
    function setupChipGroup(groupId) {
      const container = document.getElementById(groupId);
      if (!container) return;
      container.querySelectorAll(".chip-select").forEach(btn => {
        btn.addEventListener("click", () => {
          btn.classList.toggle("selected");
        });
      });
    }

    // Other sport button toggle
    sportOtherBtn.addEventListener("click", () => {
      if (sportOtherBtn.classList.contains("selected")) {
        sportOtherContainer.classList.remove("hidden");
        sportOtherInput.focus();
      } else {
        sportOtherContainer.classList.add("hidden");
        sportOtherInput.value = "";
      }
    });

    function getSelectedChips(groupId) {
      const container = document.getElementById(groupId);
      if (!container) return [];
      const selected = [];
      container.querySelectorAll(".chip-select.selected").forEach(btn => {
        if (btn.dataset.val !== "Other") {
          selected.push(btn.dataset.val);
        }
      });
      return selected;
    }

    setupChipGroup("group-sports");
    setupChipGroup("group-social");
    setupChipGroup("group-intensity");
    setupChipGroup("group-schedule");
    setupChipGroup("group-locations");

    function updateStepUI(newStep) {
      step = newStep;
      clearError();

      document.getElementById("step-1").classList.toggle("hidden", step !== 1);
      document.getElementById("step-2").classList.toggle("hidden", step !== 2);
      document.getElementById("step-3").classList.toggle("hidden", step !== 3);

      const activeBar = "h-1 flex-1 rounded-full bg-zinc-950 dark:bg-white transition-all";
      const inactiveBar = "h-1 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-800 transition-all";

      document.getElementById("bar-1").className = step >= 1 ? activeBar : inactiveBar;
      document.getElementById("bar-2").className = step >= 2 ? activeBar : inactiveBar;
      document.getElementById("bar-3").className = step >= 3 ? activeBar : inactiveBar;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Step 1: Email + Password
    document.getElementById("btn-step1").addEventListener("click", () => {
      const email = emailInp.value.trim();
      const val = validateStudentEmail(email);
      if (!val.isValid) {
        showError(val.error);
        return;
      }
      const pwd = passwordInp.value;
      if (!pwd || pwd.length < 6) {
        showError("Please enter a password with at least 6 characters.");
        return;
      }
      updateStepUI(2);
    });

    // Step 2: Name
    document.getElementById("btn-back-step2").addEventListener("click", () => updateStepUI(1));
    document.getElementById("btn-step2").addEventListener("click", () => {
      const name = nameInp.value.trim();
      if (!name || name.length < 2) {
        showError("Please enter your name.");
        return;
      }
      updateStepUI(3);
    });

    // Step 3: Finish & Submit
    document.getElementById("btn-back-step3").addEventListener("click", () => updateStepUI(2));
    document.getElementById("btn-finish").addEventListener("click", async () => {
      const sports = getSelectedChips("group-sports");
      const customSport = sportOtherInput.value.trim();
      if (customSport) {
        sports.push(customSport);
      }

      const social = getSelectedChips("group-social");
      const intensity = getSelectedChips("group-intensity");
      const schedule = getSelectedChips("group-schedule");
      const locations = getSelectedChips("group-locations");

      if (sports.length === 0) {
        showError("Please select at least one sport or type your other sport.");
        return;
      }

      const btn = document.getElementById("btn-finish");
      btn.disabled = true;
      btn.textContent = "Creating account...";

      const email = emailInp.value.trim();
      const password = passwordInp.value;
      const fullName = nameInp.value.trim();

      try {
        const res = await registerStudentWithPassword({
          email,
          password,
          fullName,
          avatarId: selectedAvatarId,
          sports,
          socialPreference: social,
          intensityPreference: intensity,
          schedulePreference: schedule,
          preferredLocations: locations
        });

        if (res.success) {
          window.location.href = "./welcome.html";
        } else {
          showError(res.error || "Unable to create account.");
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      } catch (err) {
        showError(err.message || "An unexpected error occurred.");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });

  </script>

</body>
</html>
