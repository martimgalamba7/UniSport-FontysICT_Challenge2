<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSport • Welcome</title>

  <link rel="icon" type="image/png" href="/assets/logoUniSport.png" />
  <link rel="apple-touch-icon" href="/assets/logoUniSport.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- External Styles & Theme Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/cookie-notice.css" />
  <script src="./js/theme.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-white text-zinc-900 dark:bg-black dark:text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-150">

  <!-- Top Navigation Header -->
  <header class="w-full px-6 sm:px-12 py-5 flex items-center justify-between border-b border-zinc-100 dark:border-zinc-900">
    <a href="/challenge2/unisport" class="flex items-center space-x-2.5">
      <img src="/assets/logoUniSport.png" alt="UniSport" class="h-7 w-auto object-contain" onerror="this.src='./assets/logoUniSport.png';" />
      <span class="font-bold text-lg tracking-tight text-zinc-950 dark:text-white">UniSport</span>
    </a>

    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-900 text-zinc-600 dark:text-zinc-400 transition cursor-pointer" aria-label="Toggle Theme">
        <i data-lucide="sun" class="icon-sun w-4 h-4 hidden"></i>
        <i data-lucide="moon" class="icon-moon w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Clean Minimal Stage -->
  <main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm space-y-6 text-center">

      <!-- Minimal Avatar -->
      <div class="w-20 h-20 rounded-full overflow-hidden mx-auto bg-zinc-100 dark:bg-zinc-900 flex items-center justify-center">
        <div id="user-avatar-inner" class="w-full h-full flex items-center justify-center"></div>
      </div>

      <!-- Typography -->
      <div class="space-y-1.5">
        <h1 id="welcome-title" class="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-950 dark:text-white">
          Welcome!
        </h1>
        <p id="welcome-subtitle" class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400">
          Loading student session...
        </p>
      </div>

      <!-- Action & Direct Link -->
      <div class="pt-2 space-y-3">
        <a 
          href="/challenge2/unisport/app" 
          id="btn-goto-app"
          class="w-full inline-flex items-center justify-center py-3.5 rounded-xl bg-zinc-950 hover:bg-zinc-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 text-sm font-semibold transition cursor-pointer"
        >
          <span id="btn-goto-text">Open Web App</span>
          <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
        </a>

        <p id="welcome-redirect-msg" class="text-[11px] text-zinc-400 dark:text-zinc-600">
          Redirecting automatically in a moment...
        </p>
      </div>

      <!-- Footer Sign-Out Link -->
      <div class="pt-6 border-t border-zinc-100 dark:border-zinc-900 text-center">
        <p class="text-xs text-zinc-500 dark:text-zinc-400">
          Not your account? 
          <button id="btn-switch-account" class="font-semibold text-zinc-950 dark:text-white hover:underline ml-1 cursor-pointer">
            Sign out
          </button>
        </p>
      </div>

    </div>
  </main>

  <!-- Page Controller -->
  <script src="./js/cookie-notice.js"></script>
  <script type="module" src="./js/welcome.js"></script>
</body>
</html>
